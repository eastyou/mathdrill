name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test worksheet generation
        run: |
          python -m mathdrill --ops add,sub,mul,div --count 20 --seed 7 -o smoke.html
          python -c "text = open('smoke.html', encoding='utf-8').read(); marker = 'class=' + chr(34) + 'item' + chr(34); assert text.count(marker) == 20; print('ok')"
