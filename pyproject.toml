[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mathdrill"
version = "0.1.0"
description = "口算题生成器：按题型和数值范围出题，生成可打印 A4 练习纸与答案页"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "teacher", "math", "worksheet", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
mathdrill = "mathdrill.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/mathdrill"
Source = "https://github.com/eastyou/mathdrill"

[tool.setuptools]
packages = ["mathdrill"]
